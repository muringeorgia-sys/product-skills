<style>
/* Стили фичи: только var(--…) из tokens.css, без сырых цветов. Новое помечай data-ds="НЕТ В DS: …". */
.f-section { margin-top: var(--sp-32); }

<body>

<section data-screen="main" data-title="Главный экран">
  <!-- @include web-header active="passenger" -->
  <nav class="site-crumbs" aria-label="Хлебные крошки"><a data-stub="Главная страница">Главная</a><span>›</span><span>Раздел</span></nav>
  <main class="site-main">
    <h1 class="t-h1">Заголовок экрана</h1>

    <section class="f-section">
      <div class="f-section__head">
        <h2 class="t-h2">Новые объявления</h2>
        <a class="link link--info" data-stub="Каталог">Смотреть все<i class="ic--20" data-icon="chevron-right"></i></a>
      </div>
      <div class="site-grid">
        <template data-each="cars">
          <article class="card site-card" data-ds="НЕТ В DS: web-карточка (по замерам сайта)" data-stub="Страница объявления">
            <div class="card__photos"><div class="card__photo ph"><i data-icon="car"></i></div>
              <div class="card__tags"><span class="tag tag--status-s" data-item-if="status">{{status}}</span></div></div>
            <div class="card__body">
              <div class="card__head">
                <div class="card__prices">
                  <div class="card__price-row"><span class="tag tag--premium">{{som|som}}</span><span class="card__price-sep"></span><p class="card__price">{{usd|usd}}</p></div>
                  <div class="card__credit" data-item-if="monthly"><span class="tag tag--credit">от {{monthly|som}}</span>в месяц</div>
                </div>
                <button class="card__fav" type="button" aria-label="В избранное" data-toggle-class="is-selected"><i data-icon="heart"></i></button>
              </div>
              <div class="card__specs">
                <p class="card__title">{{title}}<span class="card__dot"></span>{{year}}<span class="card__dot"></span>{{km}}</p>
                <p class="card__meta">{{specs}}</p>
                <p class="card__meta">{{city}}</p>
              </div>
            </div>
          </article>
        </template>
      </div>
    </section>

    <div class="f-section"><button class="btn btn--primary" type="button" data-open="example">Открыть окно</button></div>
  </main>
  <!-- @include web-footer -->
</section>

<div data-modal="example" data-over="main">
  <div class="modal" data-ds="НЕТ В DS: окно">
    <h3 class="modal__title">Заголовок окна</h3>
    <p class="modal__text">Текст окна.</p>
    <div class="modal__actions"><button class="btn btn--primary btn--block" type="button" data-close>Понятно</button></div>
  </div>
</div>

// Логика фичи: расчёты, фильтрация, генерация данных. Подписки — Proto.on('state', fn), см. prototype-format.md.
